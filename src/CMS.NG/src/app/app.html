@if (auth.isAuthenticated()) {
  <div class="layout" [class.layout-collapsed]="collapsed()">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="brand">{{ title() }}</span>
        <button
          type="button"
          class="sidebar-toggle"
          [attr.aria-label]="collapsed() ? '展開選單' : '收合選單'"
          (click)="toggleSidebar()">
          <i class="pi" [class.pi-angle-left]="!collapsed()" [class.pi-angle-right]="collapsed()"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        @for (group of visibleNavGroups(); track group.label) {
          <div class="nav-group">
            <button type="button" class="nav-group-header" (click)="toggleGroup(group)">
              <i [class]="group.icon"></i>
              <span class="nav-label">{{ group.label }}</span>
              <i class="pi nav-caret" [class.pi-angle-down]="group.expanded" [class.pi-angle-right]="!group.expanded"></i>
            </button>

            @if (group.expanded) {
              <ul class="nav-items">
                @for (item of group.items; track item.route) {
                  <li>
                    <a [routerLink]="item.route" routerLinkActive="active">
                      <i [class]="item.icon"></i>
                      <span class="nav-label">{{ item.label }}</span>
                    </a>
                  </li>
                }
              </ul>
            }
          </div>
        }
      </nav>

      <div class="sidebar-user">
        <div class="user-info">
          <i class="pi pi-user"></i>
          <span class="nav-label user-name">{{ auth.userName() }}</span>
        </div>
        <a class="profile-link" routerLink="/profile" routerLinkActive="active" aria-label="我的個人資料 My Profile">
          <i class="pi pi-id-card"></i>
          <span class="nav-label">我的個人資料 My Profile</span>
        </a>
        <button type="button" class="logout-button" (click)="logout()" aria-label="登出 Logout">
          <i class="pi pi-sign-out"></i>
          <span class="nav-label">登出 Logout</span>
        </button>
      </div>
    </aside>

    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}

<p-toast position="top-right" />
<p-confirmDialog />
