<div class="page-toolbar">
  <div class="page-title">
    <h1>使用者 AppUser</h1>
    <span class="page-subtitle">系統登入帳號</span>
  </div>

  <div class="page-actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="hasActiveFilters ? '!' : undefined"
      (onClick)="filterDrawerVisible.set(true)" />
    <p-button label="新增" icon="pi pi-plus" severity="success" routerLink="/app-users/new" />
  </div>
</div>

<div class="card">
  <p-table
    [value]="users()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50, 100]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    paginatorPosition="top"
    dataKey="pkid"
    styleClass="p-datatable-sm p-datatable-gridlines"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)">

    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="userId">帳號 <p-sortIcon field="userId" /></th>
        <th pSortableColumn="userName">使用者名稱 <p-sortIcon field="userName" /></th>
        <th pSortableColumn="isActive" style="width: 7rem">啟用 <p-sortIcon field="isActive" /></th>
        <th pSortableColumn="passwordUpdatedTime" style="width: 12rem">密碼更新時間 <p-sortIcon field="passwordUpdatedTime" /></th>
        <th pSortableColumn="roleCount" style="width: 7rem">角色數 <p-sortIcon field="roleCount" /></th>
        <th style="width: 9rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-user>
      <tr>
        <td>{{ user.pkid }}</td>
        <td>{{ user.userId }}</td>
        <td>{{ user.userName }}</td>
        <td>
          @if (user.isActive) {
            <p-tag value="啟用" severity="success" />
          } @else {
            <p-tag value="停用" severity="secondary" />
          }
        </td>
        <td>
          @if (user.passwordUpdatedTime) {
            <!-- No 'Z' — see app-user-detail.html. SYSDATETIME() writes local time; treating it as UTC
                 shifts the display by the browser's offset. -->
            {{ user.passwordUpdatedTime | date: 'yyyy-MM-dd HH:mm' }}
          } @else {
            <span class="text-muted">—</span>
          }
        </td>
        <td class="text-right">{{ user.roleCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              pTooltip="檢視"
              [ariaLabel]="'檢視 ' + user.userId"
              (onClick)="view(user)" />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              pTooltip="編輯"
              [ariaLabel]="'編輯 ' + user.userId"
              (onClick)="edit(user)" />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              pTooltip="刪除"
              [ariaLabel]="'刪除 ' + user.userId"
              (onClick)="confirmDelete(user)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="empty-row">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [visible]="filterDrawerVisible()"
  (visibleChange)="filterDrawerVisible.set($event)"
  header="搜尋條件"
  position="right"
  [style]="{ width: '22rem' }">

  <div class="field">
    <label for="filter-keyword">關鍵字</label>
    <input
      id="filter-keyword"
      pInputText
      class="w-full"
      placeholder="帳號／使用者名稱"
      [(ngModel)]="filters.keyword"
      (keyup.enter)="applyFilters()" />
  </div>

  <div class="field">
    <label for="filter-active">啟用狀態</label>
    <p-select
      inputId="filter-active"
      styleClass="w-full"
      appendTo="body"
      [options]="activeOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="filters.isActive" />
  </div>

  <div class="drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
