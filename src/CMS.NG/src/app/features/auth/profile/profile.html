<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-toolbar">
    <div class="page-title">
      <h1>我的個人資料 My Profile</h1>
    </div>

    <div class="page-actions">
      <p-button label="儲存" icon="pi pi-check" severity="success" type="submit" [loading]="saving()" />
    </div>
  </div>

  <div class="card">
    <h2 class="card-title">帳號資料</h2>

    <div class="field">
      <label for="userId">帳號 User ID</label>
      <input id="userId" pInputText class="w-full" [value]="userId()" readonly disabled />
      <small class="field-hint">帳號不可修改。</small>
    </div>

    <div class="field">
      <label for="userName">使用者名稱 User Name<span class="required-mark">*</span></label>
      <input id="userName" pInputText class="w-full" formControlName="userName" maxlength="200" />
      @if (isInvalid()) {
        <div class="field-error">使用者名稱為必填，且長度不可超過 200 字。</div>
      }
    </div>

    <div class="field">
      <label>角色 Roles</label>
      <div class="roles" data-testid="roles">
        @for (role of roles(); track role) {
          <p-tag [value]="role" severity="info" />
        } @empty {
          <span class="field-hint">尚無角色。</span>
        }
      </div>
      <small class="field-hint">角色為唯讀，無法在此變更。</small>
    </div>
  </div>
</form>
