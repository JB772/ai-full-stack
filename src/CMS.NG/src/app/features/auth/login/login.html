<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login-title">UWA CMS</h1>
    <p class="login-subtitle">請登入 Please sign in</p>

    @if (errorMessage()) {
      <div class="login-error" role="alert">{{ errorMessage() }}</div>
    }

    <div class="field">
      <label for="userId">帳號 User ID</label>
      <input id="userId" type="text" pInputText formControlName="userId" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">密碼 Password</label>
      <input
        id="password"
        type="password"
        pInputText
        formControlName="password"
        autocomplete="current-password" />
    </div>

    <p-button
      type="submit"
      label="登入 Login"
      [loading]="submitting()"
      [disabled]="submitting()"
      styleClass="login-submit" />
  </form>
</div>
