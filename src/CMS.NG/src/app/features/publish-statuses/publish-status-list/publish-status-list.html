<div class="page-toolbar">
  <div class="page-title">
    <h1>發布狀態 PublishStatus</h1>
    <span class="page-subtitle">內容發布狀態代碼表</span>
  </div>

  <div class="page-actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="hasActiveFilters ? '!' : undefined"
      (onClick)="filterDrawerVisible.set(true)" />
    <p-button label="新增" icon="pi pi-plus" severity="success" routerLink="/publish-statuses/new" />
  </div>
</div>

<div class="card">
  <p-table
    [value]="statuses()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50, 100]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    paginatorPosition="top"
    dataKey="pkid"
    styleClass="p-datatable-sm p-datatable-gridlines"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)">

    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
        <th pSortableColumn="isDraft" style="width: 7rem">草稿 <p-sortIcon field="isDraft" /></th>
        <th pSortableColumn="isPublished" style="width: 7rem">已發布 <p-sortIcon field="isPublished" /></th>
        <th pSortableColumn="isDiscontinued" style="width: 7rem">已下架 <p-sortIcon field="isDiscontinued" /></th>
        <th pSortableColumn="courseCount" style="width: 7rem">課程數 <p-sortIcon field="courseCount" /></th>
        <th pSortableColumn="promotionCount" style="width: 8rem">促銷活動數 <p-sortIcon field="promotionCount" /></th>
        <th style="width: 9rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-status>
      <tr>
        <td>{{ status.pkid }}</td>
        <td>{{ status.description }}</td>
        <td class="text-center">
          <i class="pi" [class.pi-check]="status.isDraft" [class.pi-minus]="!status.isDraft"
             [class.flag-on]="status.isDraft" [attr.aria-label]="status.isDraft ? '是' : '否'"></i>
        </td>
        <td class="text-center">
          <i class="pi" [class.pi-check]="status.isPublished" [class.pi-minus]="!status.isPublished"
             [class.flag-on]="status.isPublished" [attr.aria-label]="status.isPublished ? '是' : '否'"></i>
        </td>
        <td class="text-center">
          <i class="pi" [class.pi-check]="status.isDiscontinued" [class.pi-minus]="!status.isDiscontinued"
             [class.flag-on]="status.isDiscontinued" [attr.aria-label]="status.isDiscontinued ? '是' : '否'"></i>
        </td>
        <td class="text-right">{{ status.courseCount }}</td>
        <td class="text-right">{{ status.promotionCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              pTooltip="檢視"
              [attr.aria-label]="'檢視 ' + status.description"
              (onClick)="view(status)" />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              pTooltip="編輯"
              [attr.aria-label]="'編輯 ' + status.description"
              (onClick)="edit(status)" />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              pTooltip="刪除"
              [attr.aria-label]="'刪除 ' + status.description"
              (onClick)="confirmDelete(status)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="8" class="empty-row">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [visible]="filterDrawerVisible()"
  (visibleChange)="filterDrawerVisible.set($event)"
  header="搜尋條件"
  position="right"
  [style]="{ width: '22rem' }">

  <div class="field">
    <label for="filter-keyword">關鍵字</label>
    <input
      id="filter-keyword"
      pInputText
      class="w-full"
      placeholder="狀態說明"
      [(ngModel)]="filters.keyword"
      (keyup.enter)="applyFilters()" />
  </div>

  <div class="field">
    <label for="filter-is-draft">草稿</label>
    <p-select
      inputId="filter-is-draft"
      styleClass="w-full"
      appendTo="body"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="filters.isDraft" />
  </div>

  <div class="field">
    <label for="filter-is-published">已發布</label>
    <p-select
      inputId="filter-is-published"
      styleClass="w-full"
      appendTo="body"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="filters.isPublished" />
  </div>

  <div class="field">
    <label for="filter-is-discontinued">已下架</label>
    <p-select
      inputId="filter-is-discontinued"
      styleClass="w-full"
      appendTo="body"
      [options]="triStateOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="filters.isDiscontinued" />
  </div>

  <div class="drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
