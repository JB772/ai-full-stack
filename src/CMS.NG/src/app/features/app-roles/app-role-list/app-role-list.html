<div class="page-toolbar">
  <div class="page-title">
    <h1>角色 AppRole</h1>
    <span class="page-subtitle">使用者角色</span>
  </div>

  <div class="page-actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="hasActiveFilters ? '!' : undefined"
      (onClick)="filterDrawerVisible.set(true)" />
    <p-button label="新增" icon="pi pi-plus" severity="success" routerLink="/app-roles/new" />
  </div>
</div>

<div class="card">
  <p-table
    [value]="roles()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50, 100]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    paginatorPosition="top"
    dataKey="pkid"
    styleClass="p-datatable-sm p-datatable-gridlines"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)">

    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" style="width: 9rem">權限等級 <p-sortIcon field="permissionLevel" /></th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" style="width: 8rem">使用者數 <p-sortIcon field="userCount" /></th>
        <th style="width: 9rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-role>
      <tr>
        <td>{{ role.pkid }}</td>
        <td>{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
        <td class="text-right">{{ role.permissionLevel }}</td>
        <td>{{ role.description }}</td>
        <td class="text-right">{{ role.userCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              pTooltip="檢視"
              [ariaLabel]="'檢視 ' + role.roleId"
              (onClick)="view(role)" />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              pTooltip="編輯"
              [ariaLabel]="'編輯 ' + role.roleId"
              (onClick)="edit(role)" />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              pTooltip="刪除"
              [ariaLabel]="'刪除 ' + role.roleId"
              (onClick)="confirmDelete(role)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="empty-row">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [visible]="filterDrawerVisible()"
  (visibleChange)="filterDrawerVisible.set($event)"
  header="搜尋條件"
  position="right"
  [style]="{ width: '22rem' }">

  <div class="field">
    <label for="filter-keyword">關鍵字</label>
    <input
      id="filter-keyword"
      pInputText
      class="w-full"
      placeholder="角色代碼／角色名稱／描述"
      [(ngModel)]="filters.keyword"
      (keyup.enter)="applyFilters()" />
  </div>

  <div class="field">
    <label for="filter-level-from">權限等級 (下限)</label>
    <p-inputnumber
      inputId="filter-level-from"
      styleClass="w-full"
      [min]="0"
      [(ngModel)]="filters.permissionLevelFrom" />
  </div>

  <div class="field">
    <label for="filter-level-to">權限等級 (上限)</label>
    <p-inputnumber
      inputId="filter-level-to"
      styleClass="w-full"
      [min]="0"
      [(ngModel)]="filters.permissionLevelTo" />
  </div>

  <div class="drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
