<div class="page-toolbar">
  <div class="page-title">
    <h1>課程群組 CourseGroup</h1>
    <span class="page-subtitle">課程的分類群組</span>
  </div>

  <div class="page-actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      [badge]="hasActiveFilters ? '!' : undefined"
      (onClick)="filterDrawerVisible.set(true)" />
    <p-button label="新增" icon="pi pi-plus" severity="success" routerLink="/course-groups/new" />
  </div>
</div>

<div class="card">
  <p-table
    [value]="groups()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    [rowsPerPageOptions]="[10, 20, 50, 100]"
    [sortField]="sortField"
    [sortOrder]="sortOrder"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    paginatorPosition="top"
    dataKey="pkid"
    styleClass="p-datatable-sm p-datatable-gridlines"
    (onSort)="onSort($event)"
    (onPage)="onPage($event)">

    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="description">群組說明 <p-sortIcon field="description" /></th>
        <th pSortableColumn="courseCount" style="width: 7rem">課程數 <p-sortIcon field="courseCount" /></th>
        <th pSortableColumn="partnerCourseGroupCount" style="width: 10rem">
          夥伴課程群組數 <p-sortIcon field="partnerCourseGroupCount" />
        </th>
        <th style="width: 9rem">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-group>
      <tr>
        <td>{{ group.pkid }}</td>
        <td>{{ group.description }}</td>
        <td class="text-right">{{ group.courseCount }}</td>
        <td class="text-right">{{ group.partnerCourseGroupCount }}</td>
        <td>
          <div class="row-actions">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              pTooltip="檢視"
              [ariaLabel]="'檢視 ' + group.description"
              (onClick)="view(group)" />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              pTooltip="編輯"
              [ariaLabel]="'編輯 ' + group.description"
              (onClick)="edit(group)" />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              pTooltip="刪除"
              [ariaLabel]="'刪除 ' + group.description"
              (onClick)="confirmDelete(group)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5" class="empty-row">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer
  [visible]="filterDrawerVisible()"
  (visibleChange)="filterDrawerVisible.set($event)"
  header="搜尋條件"
  position="right"
  [style]="{ width: '22rem' }">

  <div class="field">
    <label for="filter-keyword">關鍵字</label>
    <input
      id="filter-keyword"
      pInputText
      class="w-full"
      placeholder="群組說明"
      [(ngModel)]="filters.keyword"
      (keyup.enter)="applyFilters()" />
  </div>

  <div class="drawer-actions">
    <p-button label="清除" icon="pi pi-times" severity="secondary" [outlined]="true" (onClick)="clearFilters()" />
    <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
  </div>
</p-drawer>
